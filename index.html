<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guionista</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: barra superior + (lista de documentos | área de trabajo). El guion se ve como hoja carta sobre fondo oscuro. */
:root{--bg:#0f172a;--panel:#1e293b;--panel2:#273449;--line:#334155;--fg:#e2e8f0;--mut:#94a3b8;--amber:#f59e0b;--amber2:#fbbf24;--ok:#10b981;--bad:#f87171;
 --display:'Barlow Condensed','Arial Narrow',sans-serif;--body:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;--script:'Courier Prime','Courier New',Courier,monospace;
 color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--body);-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:6px 11px;min-height:32px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--amber)}
.btn.pri{background:var(--amber);color:#1a1205;border-color:var(--amber);font-weight:600}
.btn.pri:hover{background:var(--amber2)}
.btn.ghost{background:transparent}
.btn.sm{min-height:26px;padding:2px 8px;font-size:12px}
.btn.on{border-color:var(--amber);color:var(--amber)}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select,textarea{background:#0b1222;border:1px solid var(--line);border-radius:5px;padding:6px 8px;min-height:32px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--amber);outline:none}
.mono{font-family:var(--mono)}
.lbl{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0;font-weight:600}
#app{height:100%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.top{display:flex;align-items:center;gap:10px;padding:8px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.logo{font:700 22px var(--display);letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px;cursor:pointer}
.logo i{width:10px;height:22px;background:var(--amber);display:inline-block;transform:skewX(-14deg)}
.sp{flex:1}
.stat{font:12px var(--mono);color:var(--mut)}
.stat.ok{color:var(--ok)}.stat.bad{color:var(--bad)}
.main{flex:1;min-height:0;display:flex}
.scr{flex:1;min-height:0;overflow:auto;padding:22px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1100px;margin:0 auto}
/* auth */
.auth{max-width:420px;margin:7vh auto 0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:26px;display:flex;flex-direction:column;gap:12px}
.auth h1{font-size:34px}
.gbtn{background:#fff;color:#1f2937;border:0;font-weight:600;justify-content:center;min-height:40px}
.gbtn:hover{background:#f1f5f9}
.err{color:var(--bad);font-size:13px;min-height:18px}
.or{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12px}.or:before,.or:after{content:"";flex:1;border-top:1px solid var(--line)}
/* dashboard */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:16px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-width:0}
.pcard:hover{border-color:var(--amber)}
.pcard h3{font-size:22px;overflow-wrap:anywhere}
.pcard .row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.pill{font:500 11px var(--mono);border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--mut)}
.pill.pro{border-color:var(--amber);color:var(--amber)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* project */
.side{width:230px;flex:none;border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:10px;display:flex;flex-direction:column;gap:4px}
.drow{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:5px;cursor:pointer;border:1px solid transparent;min-width:0}
.drow:hover{background:var(--panel2)}
.drow.on{border-color:var(--amber);background:var(--panel2)}
.drow .ic{font:600 11px var(--mono);color:var(--amber);width:26px;flex:none}
.drow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .x{opacity:0;background:none;border:0;color:var(--mut);padding:0 4px}
.drow:hover .x{opacity:1}
.work{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.dtool{display:flex;gap:6px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.dbody{flex:1;min-height:0;overflow:auto;position:relative}
.tabs-m{display:none}
@media(max-width:760px){.side{position:absolute;z-index:6;height:calc(100% - 52px);transform:translateX(-100%);transition:transform .2s}.side.open{transform:none}.tabs-m{display:inline-flex}.main{position:relative}}
/* editor de guion */
.ed{display:flex;height:100%;min-height:0}
.nav{width:220px;flex:none;border-right:1px solid var(--line);overflow:auto;padding:8px;background:#0c1426;font-size:12px}
.nav .sc{display:flex;gap:6px;padding:5px 6px;border-radius:4px;cursor:pointer;align-items:flex-start}
.nav .sc:hover{background:var(--panel2)}
.nav .sc b{font:500 11px var(--mono);color:var(--amber);min-width:22px}
.nav .sc span{flex:1;min-width:0;overflow-wrap:anywhere}
.nav .mv{display:none;gap:2px}.nav .sc:hover .mv{display:flex}
.nav .mv button{background:none;border:0;color:var(--mut);padding:0 3px}
@media(max-width:900px){.nav{display:none}.nav.show{display:block;position:absolute;z-index:5;height:100%}}
.pw{flex:1;min-width:0;overflow:auto;padding:24px 10px 80px;background:#0a101f;position:relative}
.sheet{width:816px;margin:0 auto;background:#fffefa;color:#111;box-shadow:0 6px 30px rgba(0,0,0,.5);padding:96px 96px 96px 144px;min-height:1056px;transform-origin:top center}
.page{outline:none;font:16px/16px var(--script);counter-reset:sc;min-height:864px;caret-color:#b45309}
.page .b{position:relative;min-height:16px;white-space:pre-wrap;overflow-wrap:break-word}
.b[data-t=scene]{text-transform:uppercase;font-weight:700;margin-top:32px}
.b[data-t=scene]:first-child{margin-top:0}
.b[data-t=act]{text-transform:uppercase;text-align:center;font-weight:700;text-decoration:underline;margin-top:32px}
.b[data-t=action],.b[data-t=dir]{margin-top:16px}
.b[data-t=dir]{font-style:italic;margin-left:48px}
.b[data-t=char]{text-transform:uppercase;margin-top:16px;margin-left:211px;break-after:avoid}
.b[data-t=dial]{margin-left:96px;width:336px}
.b[data-t=paren]{margin-left:154px;width:192px;break-after:avoid}
.b[data-t=trans]{text-transform:uppercase;text-align:right;margin-top:16px}
.b[data-t=shot]{text-transform:uppercase;margin-top:16px}
.b[data-t=text]{margin-top:16px}
.b[data-t=scene]{counter-increment:sc}
.b[data-t=scene]:not(:empty)::before{content:counter(sc);position:absolute;left:-58px;font-weight:400}
.b[data-t=scene]:not(:empty)::after{content:counter(sc);position:absolute;right:-58px;font-weight:400}
.b[data-t=scene]:empty::after{content:"INT. / EXT. LUGAR - DÍA";color:#b8b3a6;font-weight:400}
.b[data-t=char]:empty::after{content:"PERSONAJE";color:#b8b3a6}
.b[data-t=dial]:empty::after{content:"diálogo";color:#b8b3a6}
.b[data-t=paren]:empty::before{content:"(";color:#b8b3a6}
.b[data-t=paren]:not(:empty)::before{content:"(";position:absolute;left:-9px}
.b[data-t=paren]:not(:empty)::after{content:")"}
.b[data-t=action]:empty::after{content:"acción";color:#b8b3a6}
.page mark{background:#fde68a;color:inherit}
.page mark[data-c=prop]{background:#fcd34d}.page mark[data-c=vest]{background:#c4b5fd}.page mark[data-c=maq]{background:#f9a8d4}.page mark[data-c=veh]{background:#fdba74}.page mark[data-c=anim]{background:#bef264}.page mark[data-c=extra]{background:#a5f3fc}.page mark[data-c=deco]{background:#d6d3d1}.page mark[data-c=son]{background:#93c5fd}.page mark[data-c=fx]{background:#fca5a5}.page mark[data-c=equ]{background:#99f6e4}
::highlight(find){background:#fde047;color:#000}
.sheet.pf{padding-top:30px}
.ac{position:fixed;z-index:30;background:var(--panel);border:1px solid var(--amber);border-radius:5px;min-width:180px;max-height:200px;overflow:auto;font:13px var(--mono)}
.ac div{padding:5px 10px;cursor:pointer}.ac div.on,.ac div:hover{background:var(--amber);color:#1a1205}
.fbar{display:flex;gap:6px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line);background:#16213a;flex-wrap:wrap}
.fbar input{width:170px}
.menu{position:absolute;z-index:25;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px;min-width:200px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.menu button{display:flex;width:100%;text-align:left;background:none;border:0;padding:6px 10px;border-radius:4px;gap:8px;align-items:center;justify-content:space-between}
.menu button:hover{background:var(--panel2)}
.menu .sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.menu kbd,kbd{font:11px var(--mono);color:var(--mut);background:#0b1222;border:1px solid var(--line);border-radius:3px;padding:0 5px}
/* tablas y tarjetas */
.tw{padding:14px;overflow:auto}
table.tb{border-collapse:collapse;width:100%;min-width:640px}
.tb th{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);text-align:left;padding:6px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:1}
.tb td{border-bottom:1px solid #1d2a40;padding:2px;vertical-align:top}
.tb td input,.tb td select,.tb td textarea{background:transparent;border-color:transparent;min-height:30px;resize:none;overflow:hidden}
.tb td input:hover,.tb td select:hover,.tb td textarea:hover{border-color:var(--line)}
.tb tr.sel td{background:#162038}
.tb td.n{font:11px var(--mono);color:var(--mut);width:30px;text-align:center;cursor:pointer;padding-top:9px}
.tb td.t{font:500 13px var(--mono);text-align:right;padding:8px 6px;white-space:nowrap}
.tb tfoot td{font:500 13px var(--mono);padding:6px;color:var(--amber)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;padding:16px;align-content:start}
.ic-card{background:#f5f0e1;color:#1c1917;border-radius:4px;padding:8px 10px 10px;display:flex;flex-direction:column;gap:4px;border-top:6px solid var(--cc,#f59e0b);box-shadow:0 3px 10px rgba(0,0,0,.4);min-width:0}
.ic-card.sel{outline:2px solid var(--amber);outline-offset:2px}
.ic-card input,.ic-card textarea{background:transparent;border:0;color:inherit;padding:2px;min-height:0}
.ic-card input{font-weight:700;font-size:15px}
.ic-card textarea{resize:vertical;min-height:90px;font-size:13px}
.ic-card .hd{display:flex;align-items:center;gap:6px;font:500 11px var(--mono);color:#78716c}
.ic-card .hd span.dr{cursor:grab;flex:1}
.ic-card .hd button{background:none;border:0;padding:0 2px;color:#78716c}
.dragging{opacity:.4}
.over{outline:2px dashed var(--amber)}
/* informes */
.rep{padding:16px;display:flex;flex-direction:column;gap:14px}
.chip{display:inline-block;font:11px var(--mono);padding:1px 7px;border-radius:3px;margin:1px 3px 1px 0;color:#111;background:#fcd34d}
.chip[data-c=char]{background:#cbd5e1}.chip[data-c=vest]{background:#c4b5fd}.chip[data-c=maq]{background:#f9a8d4}.chip[data-c=veh]{background:#fdba74}.chip[data-c=anim]{background:#bef264}.chip[data-c=extra]{background:#a5f3fc}.chip[data-c=deco]{background:#d6d3d1}.chip[data-c=son]{background:#93c5fd}.chip[data-c=fx]{background:#fca5a5}.chip[data-c=equ]{background:#99f6e4}
.sch{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:14px;padding:14px}
@media(max-width:800px){.sch{grid-template-columns:1fr}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px;min-width:0}
.it{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:4px;border:1px solid var(--line);background:var(--bg);margin-bottom:5px;cursor:default;min-width:0}
.it.sel{border-color:var(--amber)}
.it .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.it.day{background:#3a2a07;border-color:var(--amber);font:600 13px var(--mono)}
.it.ban{background:#14304a;border-color:#38bdf8}
.rich{padding:20px;max-width:760px;margin:0 auto;min-height:60vh;outline:none;background:#fffefa;color:#1c1917;font:16px/1.6 var(--body);border-radius:4px;margin-top:16px}
/* modales */
.ov{position:fixed;inset:0;background:rgba(2,6,23,.7);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:6vh 14px;overflow:auto}
.md{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px;width:min(760px,100%);display:flex;flex-direction:column;gap:12px}
.md h2{font-size:26px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.plan{border:1px solid var(--line);border-radius:7px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.plan.hot{border-color:var(--amber)}
.plan .pr{font:700 38px var(--display)}
.plan ul{margin:0;padding-left:18px;color:var(--mut);font-size:13px}
.kt{width:100%;border-collapse:collapse;font-size:13px}.kt td{padding:4px 6px;border-bottom:1px solid #1d2a40}.kt td:first-child{white-space:nowrap}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--amber);padding:8px 14px;border-radius:6px;z-index:80;max-width:90vw}
.spin{padding:40px;text-align:center;color:var(--mut)}
.note{color:var(--mut);font-size:13px}
#printRoot{display:none}
@media print{
 body{overflow:visible;background:#fff}
 body.printing #app,body.printing #toast,body.printing .ov{display:none!important}
 body.printing #printRoot{display:block}
 #printRoot{font:12pt/12pt 'Courier Prime','Courier New',monospace;color:#000}
 #printRoot .tp{height:8in;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;break-after:page;gap:12pt}
 #printRoot .tp h1{font:700 14pt 'Courier Prime','Courier New',monospace;text-transform:uppercase;margin:0}
 #printRoot .tp .ct{position:fixed;bottom:0}
 #printRoot .b{white-space:pre-wrap;overflow-wrap:break-word;orphans:2;widows:2}
 #printRoot .b[data-t=scene]{text-transform:uppercase;font-weight:700;margin-top:24pt;break-after:avoid}
 #printRoot .b[data-t=act]{text-transform:uppercase;text-align:center;font-weight:700;text-decoration:underline;margin-top:24pt}
 #printRoot .b[data-t=action],#printRoot .b[data-t=shot],#printRoot .b[data-t=text]{margin-top:12pt}
 #printRoot .b[data-t=dir]{margin-top:12pt;margin-left:.5in;font-style:italic}
 #printRoot .b[data-t=char]{text-transform:uppercase;margin-top:12pt;margin-left:2.2in;break-after:avoid}
 #printRoot .b[data-t=dial]{margin-left:1in;width:3.5in}
 #printRoot .b[data-t=paren]{margin-left:1.6in;width:2in;break-after:avoid}
 #printRoot .b[data-t=paren]::before{content:"("}#printRoot .b[data-t=paren]::after{content:")"}
 #printRoot .b[data-t=trans]{text-transform:uppercase;text-align:right;margin-top:12pt}
 #printRoot mark{background:none}
 @page{margin:1in 1in 1in 1.5in;@top-right{content:counter(page) ".";font:12pt 'Courier Prime','Courier New',monospace}}
 @page :first{@top-right{content:none}}
 #printRoot.tb2 table{width:100%;border-collapse:collapse;font:10pt sans-serif}#printRoot.tb2 td,#printRoot.tb2 th{border:1px solid #999;padding:3pt;text-align:left}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="printRoot"></div>
<div id="toast" hidden></div>
<script>(function(){
'use strict';
/* ================= Utilidades ================= */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
function h(tag,a,...c){const e=document.createElement(tag);for(const k in a||{}){const v=a[k];if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v===true)e.setAttribute(k,'');else e.setAttribute(k,v);}for(const x of c.flat())if(x!=null&&x!==false)e.append(x.nodeType?x:document.createTextNode(x));return e;}
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
function debounce(f,ms){let t=0,last=[];const run=()=>{t=0;f(...last);};const d=(...a)=>{last=a;clearTimeout(t);t=setTimeout(run,ms);};d.flush=()=>{if(t){clearTimeout(t);run();}};d.pending=()=>!!t;d.cancel=()=>{clearTimeout(t);t=0;};return d;}
let toastT=0;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2800);}
const isMac=/Mac|iPhone|iPad/.test(navigator.platform||'');
const MOD=isMac?'⌘':'Ctrl';
function modal(content,{wide}={}){const ov=h('div',{class:'ov',onmousedown:e=>{if(e.target===ov)close();}});const box=h('div',{class:'md'},content);if(wide)box.style.width='min(1000px,100%)';ov.append(box);document.body.append(ov);const k=e=>{if(e.key==='Escape'){e.stopPropagation();close();}};addEventListener('keydown',k,true);function close(){ov.remove();removeEventListener('keydown',k,true);}return{close,box};}
function ask(msg,okText,onOk){const m=modal([h('h2',{text:'Confirmar'}),h('p',{text:msg}),h('div',{class:'bar'},h('button',{class:'btn danger',text:okText||'Aceptar',onclick:()=>{m.close();onOk();}}),h('button',{class:'btn ghost',text:'Cancelar',onclick:()=>m.close()}))]);}
function download(name,text,mime){const b=new Blob([text],{type:mime||'text/plain;charset=utf-8'}),u=URL.createObjectURL(b),a=h('a',{href:u,download:name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);}
function pickFile(accept,cb){const i=h('input',{type:'file',accept,style:'display:none'});i.addEventListener('change',()=>{if(i.files[0])cb(i.files[0]);i.remove();});document.body.append(i);i.click();}
function readText(f){return new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=ko;r.readAsText(f);});}
/* Limpia HTML: solo negrita, cursiva, subrayado y etiquetas (y listas en notas) */
function sanitize(html,wide){const t=document.createElement('template');t.innerHTML=html||'';const ok=wide?{B:1,I:1,U:1,MARK:1,UL:1,OL:1,LI:1,H2:1,H3:1,P:1,DIV:1,BR:1}:{B:1,I:1,U:1,MARK:1,BR:0};
 const walk=(n,out)=>{for(const c of [...n.childNodes]){if(c.nodeType===3){out.append(document.createTextNode(c.nodeValue));continue;}if(c.nodeType!==1)continue;
  let tg=c.tagName;if(tg==='STRONG')tg='B';if(tg==='EM')tg='I';
  if(ok[tg]===undefined||tg==='SPAN'||tg==='FONT'){walk(c,out);continue;}
  if(tg==='BR'){if(wide)out.append(document.createElement('br'));continue;}
  if(!ok[tg]){walk(c,out);continue;}
  const e=document.createElement(tg.toLowerCase());if(tg==='MARK'&&c.dataset.c)e.dataset.c=c.dataset.c.replace(/[^a-z]/g,'');walk(c,e);out.append(e);}};
 const o=document.createElement('div');walk(t.content,o);return o.innerHTML;}

function parsePlain(txt){const L=txt.replace(/\r/g,'').split('\n'),out=[];let prev=null,blank=true;
 const push=(t,s)=>{out.push({id:uid(),t,h:inlineHtml(s)});prev=t;blank=false;};
 for(let i=0;i<L.length;i++){const s=L[i].trim();if(!s){blank=true;continue;}
  if(/^[A-Za-z]+:\s/.test(s)&&out.length===0&&/^(Title|Credit|Author|Authors|Source|Draft date|Date|Contact):/i.test(s)){continue;}
  if(/^#+\s/.test(s)){push('act',s.replace(/^#+\s*/,''));continue;}
  if(/^\.(?!\.)/.test(s)){push('scene',s.slice(1));continue;}
  if(SCENE_RE.test(s)&&(blank||prev==='scene')){push('scene',s);continue;}
  if(/^>[^<]*$/.test(s)){push('trans',s.replace(/^>\s*/,''));continue;}
  if(s===s.toUpperCase()&&/TO:$|A:$|FUNDIDO.*[:.]$/.test(s)&&blank){push('trans',s);continue;}
  if(/^\(.*\)$/.test(s)&&(prev==='char'||prev==='dial'||prev==='paren')&&!blank){push('paren',s.slice(1,-1));continue;}
  if(/^@/.test(s)){push('char',s.slice(1));continue;}
  if(/^!/.test(s)){push('action',s.slice(1));continue;}
  if(blank&&s===s.toUpperCase()&&/[A-ZÁÉÍÓÚÑ]/.test(s)&&s.length<=38&&i+1<L.length&&L[i+1].trim()&&!SCENE_RE.test(s)){push('char',s.replace(/\s*\^$/,''));continue;}
  if((prev==='char'||prev==='paren')&&!blank){push('dial',s);continue;}
  if(prev==='dial'&&!blank){const o=out[out.length-1];o.h+='\n'+inlineHtml(s);continue;}
  if(prev==='action'&&!blank){const o=out[out.length-1];o.h+='\n'+inlineHtml(s);continue;}
  push('action',s);}
 return out.length?out:[{id:uid(),t:'scene',h:''}];}

 if(T.title)o.push('Title: '+T.title);if(T.title&&T.credit)o.push('Credit: '+T.credit);if(T.author)o.push('Author: '+T.author);if(T.source)o.push('Source: '+T.source);if(T.date)o.push('Draft date: '+T.date);if(T.contact)o.push('Contact: '+T.contact.replace(/\n/g,'\n    '));

  switch(b.t){case'scene':o.push('',(SCENE_RE.test(t)?'':'.')+t.toUpperCase());break;
   case'char':o.push('',t.toUpperCase());break;case'dial':o.push(t);break;case'paren':o.push('('+t+')');break;
   case'trans':o.push('',(/TO:$/.test(t.toUpperCase())?'':'> ')+t.toUpperCase());break;

function toTxt(d){const o=[],T=d.title||{};if(T.title){o.push('',T.title.toUpperCase(),'',T.credit||'',T.author||'','','');}
